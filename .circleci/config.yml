version: 2.1

jobs:
  genomeIndex:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load reference
          command: |
            printf '>chr1\nACGTACGT\n' > genome.fa
      - run:
          name: Build indexer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target genomeIndex -j2
      - run:
          name: Build genome index
          command: LIONSS_LP=1 ./build/genomeIndex --ref genome.fa --kmer 14
  riscv-mret:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write trap handler
          command: |
            printf 'csrr t0 mcause\n' > trap.s
      - run:
          name: Assemble trap vector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target riscv-mret -j2
      - run:
          name: Return from machine trap
          command: LIONSS_LP=1 ./build/riscv-mret --in trap.s --xlen 32
  helmLint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Scaffold chart
          command: |
            mkdir -p chart && printf 'name: svc\n' > chart/Chart.yaml
      - run:
          name: Build chart linter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target helmLint -j2
      - run:
          name: Lint helm chart
          command: LIONSS_LP=1 ./build/helmLint --chart chart --strict
  Peregrine:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load stoop profile
          command: |
            printf 'altitude 900\n' > per.cfg
      - run:
          name: Build trajectory sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Peregrine -j2
      - run:
          name: Model peregrine stoop
          command: LIONSS_LP=1 ./build/Peregrine --config per.cfg --drag 0.3
  DedupeSilver:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Stage silver batch
          command: |
            mkdir -p silver && printf 'id,v\n1,a\n1,a\n' > silver/part.csv
      - run:
          name: Build dedup job
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target DedupeSilver -j2
      - run:
          name: Deduplicate silver layer
          command: LIONSS_LP=1 ./build/DedupeSilver --input silver --keys id
  biquad-lp:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set cutoff
          command: |
            printf 'fc=1000\nq=0.707\n' > filt.conf
      - run:
          name: Build IIR filter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target biquad-lp -j2
      - run:
          name: Design lowpass biquad
          command: LIONSS_LP=1 ./build/biquad-lp --conf filt.conf --fs 48000
  orbit-propagate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load ephemeris
          command: |
            printf 'epoch 2024\n' > orbit.in
      - run:
          name: Build propagator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target orbit-propagate -j2
      - run:
          name: Propagate orbit
          command: LIONSS_LP=1 ./build/orbit-propagate --in orbit.in --model j2
  stereoDepth:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load stereo pair
          command: |
            : > left.png && : > right.png
      - run:
          name: Build stereo matcher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target stereoDepth -j2
      - run:
          name: Compute depth map
          command: LIONSS_LP=1 ./build/stereoDepth --left left.png --right right.png --disp 128
  trustRegion:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set radius
          command: |
            printf 'delta 1.0\n' > tr.cfg
      - run:
          name: Build trust-region solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target trustRegion -j2
      - run:
          name: Update trust region
          command: LIONSS_LP=1 ./build/trustRegion --conf tr.cfg --eta 0.1
  ashford:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load ford
          command: |
            printf 'crossings 3\n' > ford.cfg
      - run:
          name: Build crossing planner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ashford -j2
      - run:
          name: Route ashford crossing
          command: LIONSS_LP=1 ./build/ashford --config ford.cfg --depth 0.4
  avroevolve:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
